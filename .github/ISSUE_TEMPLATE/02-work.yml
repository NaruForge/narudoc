name: Work
description: 수행 승인을 받은 검증 가능한 결과 하나를 기록합니다.
labels: [work, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        이미 수행 승인을 받은 작업용 양식입니다. 승인 전 제안은 Idea 양식을 사용하세요.
        제출이나 work label 자체는 승인 근거가 아닙니다. 승인 근거가 없으면 triage에서 idea로 분류합니다.
        이 Issue는 공개됩니다. 공개 가능한 정보만 포함하세요.
        Issue 간 선행 관계는 생성 후 Relationships의 blocked by / blocking으로 연결합니다.
        진행 상태는 전용 Project의 Status에서만 관리합니다.
  - type: textarea
    id: approval
    attributes:
      label: 승인 근거
      description: 승인한 사람, 승인된 범위와 근거를 적으세요. 공개 가능한 결정이나 comment가 있으면 링크하세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경 또는 문제
      description: 이 작업이 필요한 상황과 문제를 설명하세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 이 작업이 제공할 검증 가능한 결과 하나를 적으세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 승인된 변경 범위와 대상을 적으세요.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이번 작업에서 다루지 않을 내용을 적으세요. 없으면 없다고 적으세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 검증 가능한 완료 조건
      description: 무엇을 어떻게 확인해야 작업이 완료되는지 적으세요.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 위험과 미확인 사항
      description: 제약과 위험을 적으세요. Issue 간 의존 관계의 원본은 Relationships이며, 여기에는 상태 목록을 복제하지 않습니다. 없으면 없다고 적으세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 관련 근거
      description: 관련 문서, 검증 자료, ADR, PR 등의 링크를 적으세요. 아직 없으면 없다고 적으세요.
    validations:
      required: true
