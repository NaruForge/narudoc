name: Bug
description: 기대 동작과 실제 동작의 차이를 기록합니다.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        확인한 사실과 미확인 사항을 구분하세요. 모르는 정보는 미확인이라고 적어도 됩니다.
        제출은 수정 작업의 수행 승인을 뜻하지 않습니다.
        이 Issue는 공개됩니다. 공개 가능한 정보만 포함하세요.
        Issue 간 선행 관계는 생성 후 Relationships의 blocked by / blocking으로 연결합니다.
        진행 상태는 전용 Project의 Status에서만 관리합니다.
  - type: textarea
    id: context
    attributes:
      label: 배경 또는 문제
      description: 문제가 발생한 상황과 영향을 설명하세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 확인 가능한 NaruDoc version 또는 commit, OS, 실행 환경을 적으세요. 모르는 정보는 미확인으로 표시하세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 입력과 명령 또는 조작 순서를 적으세요. 재현이 불확실하면 관찰한 조건과 확인하지 못한 부분을 구분하세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 어떤 동작이 예상되며 그 근거가 무엇인지 적으세요.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 실제 동작
      description: 직접 관찰한 결과와 공개 가능한 오류 메시지를 적으세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 수정 후 사용자가 얻어야 할 결과를 적으세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 영향을 받는 기능과 수정이 필요한 범위를 적으세요. 미확인 범위는 명시하세요.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이번 수정에서 다루지 않을 내용을 적으세요. 없거나 미확인이면 그렇게 적으세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 검증 가능한 완료 조건
      description: 수정 성공과 회귀 여부를 확인할 관찰 또는 검증 방법을 적으세요. 아직 정할 수 없다면 미확인이라고 적으세요.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 위험과 미확인 사항
      description: 제약과 위험을 적으세요. Issue 간 의존 관계의 원본은 Relationships이며, 여기에는 상태 목록을 복제하지 않습니다. 없거나 미확인이면 그렇게 적으세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 관련 근거
      description: 공개 가능한 로그, 최소 재현 자료, 관련 문서, ADR 등의 링크를 적으세요. 아직 없으면 없다고 적으세요.
    validations:
      required: true
